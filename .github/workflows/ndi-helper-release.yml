name: NDI Helper — Release

# 觸發：手動 + tag push (v0.x)
on:
  workflow_dispatch:
  push:
    tags:
      - 'ndi-helper-v*'

# 預設只讀；只有 release job 需要寫入權限（建立 GitHub Release）
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ndi-helper
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndi-helper

      # turbojpeg 系統套件 — 用 vcpkg
      - name: Setup vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: libjpeg-turbo
          triplet: x64-windows
          token: ${{ github.token }}

      - name: Build release
        run: cargo build --release

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build MSI
        run: |
          cargo wix init --force
          cargo wix --no-build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ndi-helper-windows-msi
          path: ndi-helper/target/wix/*.msi

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: ndi-helper-windows-exe
          path: ndi-helper/target/release/stage-previz-ndi-helper.exe

  build-macos:
    # 暫時關閉 — 等修好 tray Send/Sync 再開
    if: false
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ndi-helper
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndi-helper

      - name: Install jpeg-turbo
        run: brew install jpeg-turbo

      - name: Build release
        run: cargo build --release

      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: ndi-helper-macos
          path: ndi-helper/target/release/stage-previz-ndi-helper

  build-linux:
    # 暫時關閉 — 等補 nasm 依賴 + 驗證再開
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ndi-helper
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndi-helper

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build release
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: ndi-helper-linux
          path: ndi-helper/target/release/stage-previz-ndi-helper

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 建立 Release + 上傳檔案需要寫入權限（之前每次都卡在這：Resource not accessible by integration）
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 網站固定連到 releases/latest/download/stage-previz-ndi-helper-windows.msi
      # → 每版都多放一份固定檔名的 MSI，換版本網站不用改
      - name: Prepare release files
        run: |
          set -euo pipefail
          shopt -s nullglob
          msis=(artifacts/ndi-helper-windows-msi/*.msi)
          if [ "${#msis[@]}" -ne 1 ]; then
            echo "Expected exactly 1 MSI, found ${#msis[@]}"
            ls -laR artifacts
            exit 1
          fi
          mkdir -p dist
          cp "${msis[0]}" dist/
          cp "${msis[0]}" dist/stage-previz-ndi-helper-windows.msi
          cp artifacts/ndi-helper-windows-exe/stage-previz-ndi-helper.exe dist/
          ls -la dist

      - name: Make release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Windows 安裝檔（固定檔名，網站連這個）：`stage-previz-ndi-helper-windows.msi`
          generate_release_notes: true
